name: angular-workflow

on: 
  push:
    branches: [ main ]

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Setup Node Js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 21.x
      - name: Install Dependencies
        run: npm install
      - name: Build
        run: npm run build
        
