name: angular-workflow

on: 
  push:
    branches: [ main ]

jobs:
  first-job:
    runs-on: ubuntu-latest

    concurrency:
      group: deploy
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Setup Node Js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 20.x
          cache: "npm"
      - name: Install Dependencies
        run: npm install
      - name: Build
        run: npx ng build
      - name: Upload Build on Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-artifact
          path: dist/
          
    
        
        
